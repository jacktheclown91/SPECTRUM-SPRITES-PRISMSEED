<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectrum Sprites: PRISMSEED</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080812;color:#fff;font:12px monospace;overflow:hidden}body{display:grid;place-items:center}#wrap{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}canvas{width:100%;height:100%;image-rendering:pixelated;background:#000}#hud{position:absolute;inset:8px 8px auto 8px;display:flex;justify-content:space-between;pointer-events:none}#seed,#on,#new{pointer-events:auto;background:#1118;color:#fff;border:1px solid #777;padding:2px 5px;font:inherit}#seed{width:84px}#modal{position:absolute;inset:10% 12%;background:#05050af2;border:2px solid #ddd;padding:3%;font-size:clamp(13px,1.35vw,20px);line-height:1.45;white-space:pre-line}#modal button{width:31%;height:120px;margin:8px 1%;padding:10px;background:#111;color:#fff;border:1px solid #777;font:inherit;}#modal:empty{display:none}#tip{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);background:#05050add;padding:5px 10px;white-space:nowrap;font-size:13px;pointer-events:none}#tip:empty{display:none}</style><div id="wrap"><canvas id="c" width="320" height="180"></canvas><div id="hud"><span>PRISMSEED <input id="seed" maxlength="8"> <button id="on">ONLINE</button> <button id="new">NEW</button></span><span id="info"></span></div><div id="modal"></div><div id="tip"></div></div><script type="module" src="src/main.js"></script>
